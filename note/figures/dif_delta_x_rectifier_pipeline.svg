<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 18px; fill: #475569; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 6; rx: 18; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2.2; rx: 12; }
      .box-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; rx: 12; }
      .box-green { fill: #ecfdf5; stroke: #059669; stroke-width: 2.2; rx: 12; }
      .box-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.2; rx: 12; }
      .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.2; rx: 12; }
      .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.2; rx: 12; }
      .box-cyan { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.2; rx: 12; }
      .label { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 21px; font-weight: 700; fill: #0f172a; }
      .small { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 16px; fill: #334155; }
      .tiny { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 14px; fill: #475569; }
      .math { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 19px; fill: #1e293b; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7c3aed; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .badge { fill: #fefce8; stroke: #eab308; stroke-width: 1.7; rx: 10; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text class="title" x="70" y="70">DIF-Δx Rectifier / D-IF 风格采样修正头</text>
  <text class="subtitle" x="72" y="103">训练 sample，测试 μ，并用 rectifier 根据 [h, z, μ, σ] 修正 Δx；这是最接近 D-IF 的版本。</text>
  <text class="subtitle" x="72" y="127">Sample during training, use μ at test time, and rectify Δx with [h, z, μ, σ]. This is closest to D-IF.</text>

  <rect class="group" x="50" y="170" width="300" height="585"/>
  <text class="label" x="82" y="210">输入主干 / Input Trunk</text>
  <rect class="box" x="85" y="265" width="220" height="82"/>
  <text class="small" x="116" y="299">高斯 + 姿态</text>
  <text class="tiny" x="116" y="324">G<tspan baseline-shift="sub" font-size="70%">i</tspan>, x<tspan baseline-shift="sub" font-size="70%">i</tspan>, P<tspan baseline-shift="sub" font-size="70%">t</tspan></text>
  <rect class="box-blue" x="85" y="390" width="220" height="90"/>
  <text class="small" x="116" y="424">运动条件</text>
  <text class="tiny" x="116" y="450">f<tspan baseline-shift="sub" font-size="70%">ΔP</tspan>, f<tspan baseline-shift="sub" font-size="70%">V</tspan></text>
  <rect class="box-purple" x="85" y="530" width="220" height="100"/>
  <text class="small" x="116" y="565">隐藏特征</text>
  <text class="tiny" x="116" y="592">hidden feature</text>
  <text class="math" x="116" y="617">h<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <path class="arrow" d="M 195 347 L 195 390"/>
  <path class="arrow" d="M 195 480 L 195 530"/>

  <rect class="group" x="410" y="170" width="320" height="585"/>
  <text class="label" x="442" y="210">高斯分布头 / Gaussian Head</text>
  <rect class="box-green" x="455" y="276" width="230" height="92"/>
  <text class="small" x="486" y="311">μ head</text>
  <text class="math" x="486" y="338">μ<tspan baseline-shift="sub" font-size="70%">i</tspan> = W<tspan baseline-shift="sub" font-size="70%">μ</tspan>(h<tspan baseline-shift="sub" font-size="70%">i</tspan>)</text>
  <rect class="box-orange" x="455" y="430" width="230" height="96"/>
  <text class="small" x="486" y="465">σ head</text>
  <text class="math" x="486" y="492">σ<tspan baseline-shift="sub" font-size="70%">i</tspan> = softplus(W<tspan baseline-shift="sub" font-size="70%">σ</tspan>(h<tspan baseline-shift="sub" font-size="70%">i</tspan>))</text>
  <rect class="badge" x="455" y="590" width="230" height="72"/>
  <text class="small" x="482" y="623">可微采样分布</text>
  <text class="math" x="482" y="649">N(μ<tspan baseline-shift="sub" font-size="70%">i</tspan>, σ<tspan baseline-shift="sub" font-size="70%">i</tspan><tspan baseline-shift="super" font-size="70%">2</tspan>)</text>
  <path class="arrow" d="M 305 580 L 455 322"/>
  <path class="arrow" d="M 305 580 L 455 478"/>

  <rect class="group" x="790" y="150" width="335" height="625"/>
  <text class="label" x="822" y="190">样本选择 / Sample Selection</text>
  <rect class="box-cyan" x="835" y="245" width="245" height="130"/>
  <text class="small" x="872" y="280">训练 / Training</text>
  <text class="tiny" x="870" y="307">rsample with reparameterization</text>
  <text class="math" x="870" y="337">z<tspan baseline-shift="sub" font-size="70%">i</tspan> = μ<tspan baseline-shift="sub" font-size="70%">i</tspan> + σ<tspan baseline-shift="sub" font-size="70%">i</tspan> ⊙ ε<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <rect class="box-blue" x="835" y="440" width="245" height="110"/>
  <text class="small" x="872" y="475">测试 / Testing</text>
  <text class="tiny" x="870" y="502">deterministic mean</text>
  <text class="math" x="870" y="530">z<tspan baseline-shift="sub" font-size="70%">i</tspan> = μ<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <rect class="box-purple" x="835" y="620" width="245" height="78"/>
  <text class="small" x="874" y="654">统一候选点</text>
  <text class="tiny" x="872" y="678">selected Δx candidate z<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <path class="arrow" d="M 685 322 L 835 310"/>
  <path class="thin" d="M 685 478 C 745 480, 775 500, 835 497"/>
  <path class="arrow" d="M 958 375 L 958 620"/>
  <path class="arrow" d="M 958 550 L 958 620"/>

  <rect class="group" x="1185" y="170" width="360" height="585"/>
  <text class="label" x="1217" y="210">Rectifier 修正 / Rectification</text>
  <rect class="box-red" x="1230" y="275" width="270" height="130"/>
  <text class="small" x="1264" y="310">D-IF Rectifier MLP</text>
  <text class="tiny" x="1262" y="338">uses feature, sample, mean, uncertainty</text>
  <text class="math" x="1262" y="369">ρ<tspan baseline-shift="sub" font-size="70%">i</tspan> = R([h<tspan baseline-shift="sub" font-size="70%">i</tspan>, z<tspan baseline-shift="sub" font-size="70%">i</tspan>, μ<tspan baseline-shift="sub" font-size="70%">i</tspan>, σ<tspan baseline-shift="sub" font-size="70%">i</tspan>])</text>
  <rect class="box-purple" x="1230" y="475" width="270" height="92"/>
  <text class="small" x="1270" y="510">最终 Δx / Final Δx</text>
  <text class="math" x="1270" y="538">Δx<tspan baseline-shift="sub" font-size="70%">i</tspan> = z<tspan baseline-shift="sub" font-size="70%">i</tspan> + ρ<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <rect class="box" x="1230" y="630" width="270" height="82"/>
  <text class="small" x="1270" y="664">高斯位置更新</text>
  <text class="math" x="1270" y="691">x'<tspan baseline-shift="sub" font-size="70%">i</tspan> = x<tspan baseline-shift="sub" font-size="70%">i</tspan> + Δx<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <path class="arrow" d="M 1080 659 L 1230 340"/>
  <path class="thin" d="M 685 322 C 900 125, 1115 170, 1230 326"/>
  <path class="thin" d="M 685 478 C 910 520, 1050 410, 1230 360"/>
  <path class="thin" d="M 305 580 C 620 820, 990 765, 1230 370"/>
  <path class="arrow" d="M 1365 405 L 1365 475"/>
  <path class="arrow" d="M 1365 567 L 1365 630"/>
  <path class="dash" d="M 305 580 C 720 805, 1060 780, 1230 671"/>
</svg>
