<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 18px; fill: #475569; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2.2; rx: 12; }
      .box-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; rx: 12; }
      .box-green { fill: #ecfdf5; stroke: #059669; stroke-width: 2.2; rx: 12; }
      .box-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 2.2; rx: 12; }
      .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.2; rx: 12; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 6; rx: 18; }
      .label { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 21px; font-weight: 700; fill: #0f172a; }
      .small { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 16px; fill: #334155; }
      .tiny { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 14px; fill: #475569; }
      .math { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 18px; fill: #1e293b; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text class="title" x="70" y="70">基线 SeqAvatar：STMS 运动条件 / Baseline STMS Motion Conditioning</text>
  <text class="subtitle" x="72" y="102">多尺度历史到当前帧运动条件经拼接编码后，输入共享非刚性形变 MLP。</text>
  <text class="subtitle" x="72" y="126">Multi-scale history-to-current motion conditions are concatenated and encoded before a shared non-rigid deformation MLP.</text>

  <rect class="group" x="55" y="145" width="265" height="610"/>
  <text class="label" x="85" y="185">输入 / Inputs</text>
  <rect class="box" x="85" y="220" width="205" height="78"/>
  <text class="small" x="112" y="252">规范高斯</text>
  <text class="tiny" x="112" y="276">Canonical Gaussians x<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <rect class="box" x="85" y="330" width="205" height="78"/>
  <text class="small" x="112" y="362">当前 SMPL 姿态</text>
  <text class="tiny" x="112" y="386">Current SMPL Pose P<tspan baseline-shift="sub" font-size="70%">t</tspan></text>
  <rect class="box" x="85" y="440" width="205" height="92"/>
  <text class="small" x="112" y="472">SMPL 模板顶点</text>
  <text class="tiny" x="112" y="496">SMPL Template Vertices T</text>
  <rect class="box" x="85" y="565" width="205" height="105"/>
  <text class="small" x="112" y="596">历史帧</text>
  <text class="math" x="112" y="625">t-s → t</text>
  <text class="tiny" x="112" y="650">时间尺度 S = {s<tspan baseline-shift="sub" font-size="70%">1</tspan>, s<tspan baseline-shift="sub" font-size="70%">2</tspan>, s<tspan baseline-shift="sub" font-size="70%">3</tspan>}</text>

  <rect class="group" x="385" y="145" width="535" height="610"/>
  <text class="label" x="415" y="185">STMS 运动编码 / Motion Encoding</text>

  <rect class="box-blue" x="430" y="225" width="210" height="118"/>
  <text class="small" x="458" y="260">骨架运动 / Skeleton</text>
  <text class="math" x="458" y="290">ΔP<tspan baseline-shift="super" font-size="70%">s</tspan> = P<tspan baseline-shift="sub" font-size="70%">t</tspan> - P<tspan baseline-shift="sub" font-size="70%">t-s</tspan></text>
  <text class="tiny" x="458" y="318">每个尺度 s / for each scale s</text>

  <rect class="box-blue" x="690" y="225" width="185" height="118"/>
  <text class="small" x="724" y="260">尺度拼接</text>
  <text class="tiny" x="724" y="280">Concat Scales</text>
  <text class="math" x="724" y="305">[ΔP<tspan baseline-shift="super" font-size="70%">s₁</tspan>,</text>
  <text class="math" x="724" y="331"> ΔP<tspan baseline-shift="super" font-size="70%">s₂</tspan>, ΔP<tspan baseline-shift="super" font-size="70%">s₃</tspan>]</text>

  <rect class="box-blue" x="570" y="390" width="205" height="98"/>
  <text class="small" x="618" y="427">E<tspan baseline-shift="sub" font-size="70%">ΔP</tspan></text>
  <text class="tiny" x="598" y="456">骨架序列编码器 / SeqPoseEncoder</text>

  <rect class="box-green" x="430" y="555" width="210" height="118"/>
  <text class="small" x="458" y="588">局部顶点运动 / Local Vertex</text>
  <text class="math" x="458" y="618">V<tspan baseline-shift="sub" font-size="70%">i</tspan><tspan baseline-shift="super" font-size="70%">s</tspan> from KNN(T, x<tspan baseline-shift="sub" font-size="70%">i</tspan>)</text>
  <text class="tiny" x="458" y="646">每个高斯 / per Gaussian</text>

  <rect class="box-green" x="690" y="555" width="185" height="118"/>
  <text class="small" x="724" y="588">尺度拼接</text>
  <text class="tiny" x="724" y="608">Concat Scales</text>
  <text class="math" x="724" y="633">[V<tspan baseline-shift="super" font-size="70%">s₁</tspan>,</text>
  <text class="math" x="724" y="659"> V<tspan baseline-shift="super" font-size="70%">s₂</tspan>, V<tspan baseline-shift="super" font-size="70%">s₃</tspan>]</text>

  <rect class="box-green" x="570" y="705" width="205" height="88"/>
  <text class="small" x="622" y="740">E<tspan baseline-shift="sub" font-size="70%">V</tspan></text>
  <text class="tiny" x="600" y="766">点级序列编码器 / SeqXYZEncoder</text>

  <path class="thin" d="M 640 284 L 690 284"/>
  <path class="thin" d="M 782 343 L 705 390"/>
  <path class="thin" d="M 640 614 L 690 614"/>
  <path class="thin" d="M 782 673 L 705 705"/>

  <rect class="box-purple" x="980" y="325" width="235" height="112"/>
  <text class="small" x="1018" y="362">全局运动特征</text>
  <text class="tiny" x="1018" y="386">Global Motion</text>
  <text class="math" x="1030" y="410">f<tspan baseline-shift="sub" font-size="70%">ΔP</tspan> ∈ R<tspan baseline-shift="super" font-size="70%">32</tspan></text>

  <rect class="box-purple" x="980" y="590" width="235" height="112"/>
  <text class="small" x="1018" y="626">点级运动特征</text>
  <text class="tiny" x="1018" y="650">Point-wise Motion</text>
  <text class="math" x="1030" y="674">f<tspan baseline-shift="sub" font-size="70%">V</tspan> ∈ R<tspan baseline-shift="super" font-size="70%">96</tspan></text>

  <path class="arrow" d="M 775 439 L 980 381"/>
  <path class="arrow" d="M 775 749 L 980 646"/>
  <path class="thin" d="M 290 259 L 430 259"/>
  <path class="thin" d="M 290 486 L 430 602"/>
  <path class="thin" d="M 290 617 L 430 284"/>
  <path class="thin" d="M 290 617 L 430 614"/>

  <rect class="group" x="1270" y="235" width="260" height="390"/>
  <text class="label" x="1300" y="275">共享形变网络</text>
  <text class="tiny" x="1302" y="300">Shared Deformer</text>
  <rect class="box-amber" x="1305" y="315" width="190" height="128"/>
  <text class="small" x="1338" y="350">特征拼接</text>
  <text class="tiny" x="1338" y="374">Concat</text>
  <text class="tiny" x="1330" y="398">[x<tspan baseline-shift="sub" font-size="70%">i</tspan>, P<tspan baseline-shift="sub" font-size="70%">t</tspan>,</text>
  <text class="tiny" x="1330" y="422"> f<tspan baseline-shift="sub" font-size="70%">ΔP</tspan>, f<tspan baseline-shift="sub" font-size="70%">V</tspan>]</text>
  <rect class="box-amber" x="1305" y="485" width="190" height="105"/>
  <text class="small" x="1340" y="522">非刚性 MLP</text>
  <text class="tiny" x="1340" y="548">Non-rigid MLP</text>
  <text class="tiny" x="1330" y="574">Δx<tspan baseline-shift="sub" font-size="70%">i</tspan>, Δs<tspan baseline-shift="sub" font-size="70%">i</tspan>, Δr<tspan baseline-shift="sub" font-size="70%">i</tspan></text>

  <path class="arrow" d="M 1215 381 L 1305 369"/>
  <path class="arrow" d="M 1215 646 L 1305 404"/>
  <path class="thin" d="M 290 259 C 710 115, 1080 150, 1305 340"/>
  <path class="arrow" d="M 1400 443 L 1400 485"/>

  <rect class="box" x="1295" y="680" width="210" height="74"/>
  <text class="small" x="1334" y="712">光栅化</text>
  <text class="tiny" x="1343" y="736">Rasterization / Rendered image</text>
  <path class="arrow" d="M 1400 590 L 1400 680"/>

  <text class="tiny" x="420" y="816">主要不足：所有时间尺度直接拼接，所有 Gaussian 共享同一条运动编码路径。</text>
  <text class="tiny" x="420" y="840">Key limitation: all temporal scales are concatenated, and all Gaussians share the same motion encoding pathway.</text>
</svg>
