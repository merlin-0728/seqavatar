<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 18px; fill: #475569; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 6; rx: 18; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2.2; rx: 12; }
      .box-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; rx: 12; }
      .box-green { fill: #ecfdf5; stroke: #059669; stroke-width: 2.2; rx: 12; }
      .box-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.2; rx: 12; }
      .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.2; rx: 12; }
      .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.2; rx: 12; }
      .label { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 21px; font-weight: 700; fill: #0f172a; }
      .small { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 16px; fill: #334155; }
      .tiny { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 14px; fill: #475569; }
      .math { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 18px; fill: #1e293b; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #ea580c; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text class="title" x="70" y="70">SeqAvatar + Part-MoE：部位专家形变头 / Part-specific Deformation Head</text>
  <text class="subtitle" x="72" y="102">STMS 运动条件保持不变；Part-MoE 根据 Gaussian 部位标签路由最终非刚性形变头。</text>
  <text class="subtitle" x="72" y="126">STMS motion conditioning is unchanged; Part-MoE routes the final non-rigid deformation head by Gaussian part labels.</text>

  <rect class="group" x="55" y="150" width="265" height="565"/>
  <text class="label" x="85" y="190">输入 / Inputs</text>
  <rect class="box" x="85" y="225" width="205" height="78"/>
  <text class="small" x="112" y="257">规范高斯</text>
  <text class="tiny" x="112" y="281">Canonical Gaussians x<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <rect class="box" x="85" y="335" width="205" height="78"/>
  <text class="small" x="112" y="367">SMPL 姿态与历史</text>
  <text class="tiny" x="112" y="391">SMPL Pose and History</text>
  <rect class="box" x="85" y="455" width="205" height="92"/>
  <text class="small" x="112" y="487">SMPL 模板顶点</text>
  <text class="tiny" x="112" y="511">SMPL Template Vertices T</text>
  <rect class="box-orange" x="85" y="585" width="205" height="78"/>
  <text class="small" x="112" y="617">部位标签</text>
  <text class="tiny" x="112" y="641">Part Labels / nearest SMPL vertex</text>

  <rect class="group" x="380" y="150" width="375" height="565"/>
  <text class="label" x="410" y="190">原始 STMS / Original STMS</text>
  <text class="tiny" x="410" y="216">运动采样与编码器不变 / unchanged motion sampling and encoders</text>
  <rect class="box-blue" x="430" y="255" width="265" height="100"/>
  <text class="small" x="458" y="290">骨架多尺度</text>
  <text class="math" x="458" y="318">[ΔP<tspan baseline-shift="super" font-size="70%">s₁</tspan>, ΔP<tspan baseline-shift="super" font-size="70%">s₂</tspan>, ΔP<tspan baseline-shift="super" font-size="70%">s₃</tspan>]</text>
  <rect class="box-green" x="430" y="405" width="265" height="100"/>
  <text class="small" x="458" y="440">局部顶点 KNN</text>
  <text class="tiny" x="458" y="464">Local vertex KNN</text>
  <text class="math" x="458" y="486">[V<tspan baseline-shift="super" font-size="70%">s₁</tspan>, V<tspan baseline-shift="super" font-size="70%">s₂</tspan>, V<tspan baseline-shift="super" font-size="70%">s₃</tspan>]</text>
  <rect class="box-purple" x="430" y="555" width="265" height="98"/>
  <text class="small" x="484" y="590">运动编码器</text>
  <text class="tiny" x="460" y="618">Motion Encoders / SeqPoseEncoder + SeqXYZEncoder</text>

  <path class="thin" d="M 290 374 L 430 305"/>
  <path class="thin" d="M 290 501 L 430 455"/>
  <path class="arrow" d="M 562 355 L 562 405"/>
  <path class="arrow" d="M 562 505 L 562 555"/>

  <rect class="box-purple" x="815" y="350" width="245" height="130"/>
  <text class="small" x="850" y="386">共享特征</text>
  <text class="tiny" x="850" y="414">Shared Feature / features<tspan baseline-shift="sub" font-size="70%">i</tspan> = concat</text>
  <text class="tiny" x="850" y="438">[x<tspan baseline-shift="sub" font-size="70%">i</tspan>, P<tspan baseline-shift="sub" font-size="70%">t</tspan>, f<tspan baseline-shift="sub" font-size="70%">ΔP</tspan>, f<tspan baseline-shift="sub" font-size="70%">V</tspan>]</text>
  <path class="arrow" d="M 695 604 L 815 415"/>
  <path class="thin" d="M 290 264 C 480 120, 740 180, 815 375"/>

  <rect class="group" x="1115" y="145" width="395" height="610"/>
  <text class="label" x="1145" y="185">Part-MoE 形变头</text>
  <text class="tiny" x="1147" y="210">Part-MoE Deformation Head</text>

  <rect class="box-orange" x="1155" y="225" width="295" height="82"/>
  <text class="small" x="1198" y="258">标签路由器</text>
  <text class="tiny" x="1195" y="282">Label Router: p<tspan baseline-shift="sub" font-size="70%">i</tspan> = part label of Gaussian i</text>

  <rect class="box-red" x="1155" y="350" width="135" height="82"/>
  <text class="small" x="1188" y="383">专家 0</text>
  <text class="tiny" x="1191" y="407">Expert E<tspan baseline-shift="sub" font-size="70%">0</tspan> / global</text>
  <rect class="box-red" x="1315" y="350" width="135" height="82"/>
  <text class="small" x="1348" y="383">专家 p</text>
  <text class="tiny" x="1338" y="407">Expert E<tspan baseline-shift="sub" font-size="70%">p</tspan> / body part</text>

  <rect class="box-red" x="1195" y="490" width="215" height="110"/>
  <text class="small" x="1236" y="526">输出融合</text>
  <text class="tiny" x="1222" y="546">Blend Outputs</text>
  <text class="tiny" x="1222" y="568">w<tspan baseline-shift="sub" font-size="70%">global</tspan> · E<tspan baseline-shift="sub" font-size="70%">0</tspan></text>
  <text class="tiny" x="1222" y="590">+ w<tspan baseline-shift="sub" font-size="70%">part</tspan> · E<tspan baseline-shift="sub" font-size="70%">p</tspan></text>

  <rect class="box" x="1195" y="650" width="215" height="72"/>
  <text class="small" x="1242" y="682">Δx<tspan baseline-shift="sub" font-size="70%">i</tspan>, Δs<tspan baseline-shift="sub" font-size="70%">i</tspan>, Δr<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <text class="tiny" x="1260" y="705">送入渲染器 / to renderer</text>

  <path class="arrow" d="M 1060 415 L 1155 391"/>
  <path class="dash" d="M 290 624 C 660 745, 950 220, 1155 266"/>
  <path class="arrow" d="M 1302 307 L 1222 350"/>
  <path class="arrow" d="M 1302 307 L 1382 350"/>
  <path class="arrow" d="M 1222 432 L 1268 490"/>
  <path class="arrow" d="M 1382 432 L 1338 490"/>
  <path class="arrow" d="M 1302 600 L 1302 650"/>

  <rect class="box" x="805" y="575" width="265" height="95"/>
  <text class="small" x="845" y="608">关键性质 / Key Property</text>
  <text class="tiny" x="838" y="634">STMS 仍然共享 / STMS remains shared.</text>
  <text class="tiny" x="838" y="656">只有形变头按部位专家化 / Only the deformation head is part-specific.</text>

  <text class="tiny" x="80" y="805">解释：Part-MoE 提升形变预测的空间部位专门化，但不改变 STMS 的运动采样或运动编码。</text>
  <text class="tiny" x="80" y="830">Interpretation: Part-MoE improves spatial specialization of deformation, but it does not change STMS motion sampling or motion encoding.</text>
</svg>
