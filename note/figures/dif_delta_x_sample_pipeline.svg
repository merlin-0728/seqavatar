<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 18px; fill: #475569; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 6; rx: 18; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2.2; rx: 12; }
      .box-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; rx: 12; }
      .box-green { fill: #ecfdf5; stroke: #059669; stroke-width: 2.2; rx: 12; }
      .box-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.2; rx: 12; }
      .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.2; rx: 12; }
      .box-cyan { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.2; rx: 12; }
      .label { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 21px; font-weight: 700; fill: #0f172a; }
      .small { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 16px; fill: #334155; }
      .tiny { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 14px; fill: #475569; }
      .math { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 19px; fill: #1e293b; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #0891b2; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text class="title" x="70" y="70">DIF-Δx Sample / 训练采样头</text>
  <text class="subtitle" x="72" y="103">训练阶段使用 reparameterized sample，测试/渲染阶段使用 μ；Δx 直接来自选择的 z。</text>
  <text class="subtitle" x="72" y="127">Use rsample during training and μ during testing/rendering; Δx is directly selected from z.</text>

  <rect class="group" x="55" y="170" width="335" height="585"/>
  <text class="label" x="86" y="210">SeqAvatar 主干 / Trunk</text>
  <rect class="box" x="92" y="260" width="240" height="88"/>
  <text class="small" x="122" y="294">高斯与姿态</text>
  <text class="tiny" x="122" y="320">G<tspan baseline-shift="sub" font-size="70%">i</tspan>, x<tspan baseline-shift="sub" font-size="70%">i</tspan>, P<tspan baseline-shift="sub" font-size="70%">t</tspan></text>
  <rect class="box-blue" x="92" y="390" width="240" height="92"/>
  <text class="small" x="122" y="424">STMS 条件</text>
  <text class="tiny" x="122" y="450">f<tspan baseline-shift="sub" font-size="70%">ΔP</tspan>, f<tspan baseline-shift="sub" font-size="70%">V</tspan></text>
  <rect class="box-purple" x="92" y="530" width="240" height="100"/>
  <text class="small" x="122" y="566">非刚性隐藏特征</text>
  <text class="tiny" x="122" y="592">Non-rigid hidden feature</text>
  <text class="math" x="122" y="617">h<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <path class="arrow" d="M 212 348 L 212 390"/>
  <path class="arrow" d="M 212 482 L 212 530"/>

  <rect class="group" x="455" y="170" width="355" height="585"/>
  <text class="label" x="488" y="210">Δx 分布 / Δx Distribution</text>
  <rect class="box-green" x="500" y="276" width="255" height="92"/>
  <text class="small" x="532" y="311">μ head</text>
  <text class="math" x="532" y="338">μ<tspan baseline-shift="sub" font-size="70%">i</tspan> = W<tspan baseline-shift="sub" font-size="70%">μ</tspan>(h<tspan baseline-shift="sub" font-size="70%">i</tspan>)</text>
  <rect class="box-orange" x="500" y="430" width="255" height="96"/>
  <text class="small" x="532" y="465">σ head</text>
  <text class="math" x="532" y="492">σ<tspan baseline-shift="sub" font-size="70%">i</tspan> = softplus(W<tspan baseline-shift="sub" font-size="70%">σ</tspan>(h<tspan baseline-shift="sub" font-size="70%">i</tspan>))</text>
  <text class="tiny" x="532" y="515">positive uncertainty scale</text>
  <path class="arrow" d="M 332 580 L 500 322"/>
  <path class="arrow" d="M 332 580 L 500 478"/>

  <rect class="group" x="875" y="150" width="390" height="625"/>
  <text class="label" x="908" y="190">选择规则 / Selection Rule</text>
  <rect class="box-cyan" x="920" y="248" width="300" height="142"/>
  <text class="small" x="958" y="283">训练 / Training</text>
  <text class="tiny" x="956" y="311">reparameterized sampling, differentiable</text>
  <text class="math" x="956" y="342">ε<tspan baseline-shift="sub" font-size="70%">i</tspan> ~ N(0, I)</text>
  <text class="math" x="956" y="369">z<tspan baseline-shift="sub" font-size="70%">i</tspan> = μ<tspan baseline-shift="sub" font-size="70%">i</tspan> + σ<tspan baseline-shift="sub" font-size="70%">i</tspan> ⊙ ε<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <rect class="box-blue" x="920" y="455" width="300" height="120"/>
  <text class="small" x="958" y="490">测试 / Testing and Rendering</text>
  <text class="tiny" x="956" y="518">deterministic mean, no random noise</text>
  <text class="math" x="956" y="549">z<tspan baseline-shift="sub" font-size="70%">i</tspan> = μ<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <rect class="box-purple" x="965" y="650" width="210" height="78"/>
  <text class="small" x="1014" y="684">直接输出</text>
  <text class="math" x="1014" y="711">Δx<tspan baseline-shift="sub" font-size="70%">i</tspan> = z<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <path class="arrow" d="M 755 322 L 920 319"/>
  <path class="arrow" d="M 755 478 C 820 482, 855 518, 920 518"/>
  <path class="arrow" d="M 1070 390 L 1070 650"/>
  <path class="arrow" d="M 1070 575 L 1070 650"/>

  <rect class="group" x="1325" y="170" width="220" height="585"/>
  <text class="label" x="1354" y="210">高斯更新 / Update</text>
  <rect class="box" x="1360" y="342" width="150" height="94"/>
  <text class="small" x="1388" y="377">位置更新</text>
  <text class="tiny" x="1384" y="402">Position update</text>
  <text class="math" x="1382" y="426">x'<tspan baseline-shift="sub" font-size="70%">i</tspan> = x<tspan baseline-shift="sub" font-size="70%">i</tspan> + Δx<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <rect class="box" x="1360" y="510" width="150" height="92"/>
  <text class="small" x="1382" y="545">δs / δr 不变</text>
  <text class="tiny" x="1383" y="571">baseline heads kept</text>
  <path class="arrow" d="M 1175 689 L 1360 389"/>
  <path class="dash" d="M 332 580 C 655 800, 1125 790, 1360 556"/>
</svg>
