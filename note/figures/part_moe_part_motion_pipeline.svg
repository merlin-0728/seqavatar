<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 18px; fill: #475569; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 6; rx: 18; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2.2; rx: 12; }
      .box-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; rx: 12; }
      .box-green { fill: #ecfdf5; stroke: #059669; stroke-width: 2.2; rx: 12; }
      .box-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.2; rx: 12; }
      .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.2; rx: 12; }
      .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.2; rx: 12; }
      .box-cyan { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.2; rx: 12; }
      .label { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 21px; font-weight: 700; fill: #0f172a; }
      .small { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 16px; fill: #334155; }
      .tiny { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 14px; fill: #475569; }
      .math { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Helvetica, sans-serif; font-size: 18px; fill: #1e293b; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #ea580c; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text class="title" x="70" y="70">SeqAvatar + Part-MoE + 部位感知运动场 / Part-aware Motion Field</text>
  <text class="subtitle" x="72" y="102">Gaussian 部位分配同时控制运动上下文编码和部位专属形变预测。</text>
  <text class="subtitle" x="72" y="126">Gaussian part assignment controls both motion-context encoding and part-specific deformation prediction.</text>

  <rect class="group" x="50" y="150" width="250" height="610"/>
  <text class="label" x="80" y="190">输入 / Inputs</text>
  <rect class="box" x="80" y="225" width="190" height="78"/>
  <text class="small" x="106" y="257">规范高斯</text>
  <text class="tiny" x="106" y="281">Canonical Gaussians x<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <rect class="box" x="80" y="335" width="190" height="78"/>
  <text class="small" x="106" y="367">SMPL 姿态与历史</text>
  <text class="tiny" x="106" y="391">SMPL Pose and History</text>
  <rect class="box" x="80" y="445" width="190" height="92"/>
  <text class="small" x="106" y="477">SMPL 模板顶点</text>
  <text class="tiny" x="106" y="501">SMPL Template Vertices T</text>
  <rect class="box-orange" x="80" y="575" width="190" height="110"/>
  <text class="small" x="106" y="608">部位分配</text>
  <text class="tiny" x="106" y="633">Part Assignment</text>
  <text class="tiny" x="106" y="657">hard SMPL label or learned soft a<tspan baseline-shift="sub" font-size="70%">i</tspan></text>

  <rect class="group" x="350" y="145" width="455" height="615"/>
  <text class="label" x="380" y="185">部位感知 STMS / Part-aware STMS</text>
  <text class="tiny" x="380" y="211">形变前选择运动上下文 / motion context is selected before deformation</text>

  <rect class="box-blue" x="390" y="245" width="180" height="88"/>
  <text class="small" x="424" y="278">尺度 Tokens</text>
  <text class="tiny" x="416" y="304">Scale Tokens: short / mid / long</text>

  <rect class="box-green" x="590" y="245" width="175" height="88"/>
  <text class="small" x="618" y="278">局部 Tokens</text>
  <text class="tiny" x="620" y="304">Local Tokens: KNN vertex motion</text>

  <rect class="box-cyan" x="390" y="385" width="180" height="105"/>
  <text class="small" x="412" y="420">部位尺度路由</text>
  <text class="tiny" x="420" y="448">Part Scale Router: R<tspan baseline-shift="sub" font-size="70%">p</tspan>(x<tspan baseline-shift="sub" font-size="70%">i</tspan>, motion)</text>
  <text class="tiny" x="420" y="470">选择尺度 / selects scales</text>

  <rect class="box-cyan" x="590" y="385" width="175" height="105"/>
  <text class="small" x="610" y="420">部位运动专家</text>
  <text class="tiny" x="620" y="448">Part Motion Experts</text>
  <text class="tiny" x="620" y="470">M<tspan baseline-shift="sub" font-size="70%">body</tspan>, M<tspan baseline-shift="sub" font-size="70%">arm</tspan>, ...</text>

  <rect class="box-purple" x="470" y="545" width="220" height="105"/>
  <text class="small" x="510" y="582">部位专属</text>
  <text class="small" x="512" y="606">运动特征</text>
  <text class="tiny" x="506" y="624">Part-specific Motion Feature</text>
  <text class="math" x="514" y="646">f<tspan baseline-shift="sub" font-size="70%">motion,i</tspan></text>

  <path class="thin" d="M 270 374 L 390 289"/>
  <path class="thin" d="M 270 491 L 590 289"/>
  <path class="dash" d="M 270 630 L 390 437"/>
  <path class="dash" d="M 270 630 L 590 437"/>
  <path class="arrow" d="M 480 333 L 480 385"/>
  <path class="arrow" d="M 678 333 L 678 385"/>
  <path class="arrow" d="M 480 490 L 535 545"/>
  <path class="arrow" d="M 678 490 L 625 545"/>

  <rect class="group" x="855" y="145" width="290" height="615"/>
  <text class="label" x="885" y="185">特征融合 / Feature Fusion</text>
  <rect class="box-purple" x="895" y="265" width="210" height="122"/>
  <text class="small" x="932" y="300">Gaussian 特征</text>
  <text class="tiny" x="924" y="328">Gaussian Feature / concat [x<tspan baseline-shift="sub" font-size="70%">i</tspan>, P<tspan baseline-shift="sub" font-size="70%">t</tspan>,</text>
  <text class="tiny" x="924" y="352">f<tspan baseline-shift="sub" font-size="70%">motion,i</tspan>]</text>

  <rect class="box-orange" x="895" y="450" width="210" height="128"/>
  <text class="small" x="928" y="486">共享先验</text>
  <text class="tiny" x="918" y="514">Shared Prior: optional global STMS</text>
  <text class="tiny" x="918" y="538">或全局特征保留 / global feature keep</text>

  <path class="arrow" d="M 690 598 L 895 326"/>
  <path class="thin" d="M 270 264 C 520 95, 770 125, 895 300"/>
  <path class="arrow" d="M 1000 387 L 1000 450"/>

  <rect class="group" x="1195" y="145" width="345" height="615"/>
  <text class="label" x="1225" y="185">Part-MoE 形变头</text>
  <text class="tiny" x="1227" y="210">Part-MoE Head</text>
  <rect class="box-orange" x="1235" y="225" width="245" height="78"/>
  <text class="small" x="1278" y="258">共享部位路由</text>
  <text class="tiny" x="1280" y="282">Same Part Router: hard label or soft a<tspan baseline-shift="sub" font-size="70%">i</tspan></text>

  <rect class="box-red" x="1235" y="350" width="110" height="82"/>
  <text class="small" x="1262" y="383">E<tspan baseline-shift="sub" font-size="70%">0</tspan></text>
  <text class="tiny" x="1254" y="407">全局 / global</text>
  <rect class="box-red" x="1370" y="350" width="110" height="82"/>
  <text class="small" x="1395" y="383">E<tspan baseline-shift="sub" font-size="70%">p</tspan></text>
  <text class="tiny" x="1384" y="407">部位 / part</text>

  <rect class="box-red" x="1270" y="490" width="175" height="104"/>
  <text class="small" x="1306" y="525">融合</text>
  <text class="tiny" x="1296" y="552">Blend: global + part</text>
  <text class="tiny" x="1296" y="574">deformation / 形变</text>

  <rect class="box" x="1265" y="650" width="185" height="72"/>
  <text class="small" x="1296" y="682">Δx<tspan baseline-shift="sub" font-size="70%">i</tspan>, Δs<tspan baseline-shift="sub" font-size="70%">i</tspan>, Δr<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <text class="tiny" x="1315" y="705">送入渲染器 / to renderer</text>

  <path class="arrow" d="M 1105 326 L 1235 391"/>
  <path class="dash" d="M 270 630 C 690 815, 1020 190, 1235 264"/>
  <path class="arrow" d="M 1358 303 L 1290 350"/>
  <path class="arrow" d="M 1358 303 L 1425 350"/>
  <path class="arrow" d="M 1290 432 L 1328 490"/>
  <path class="arrow" d="M 1425 432 L 1390 490"/>
  <path class="arrow" d="M 1358 594 L 1358 650"/>

  <rect class="box-cyan" x="870" y="650" width="255" height="80"/>
  <text class="small" x="906" y="682">诊断可视化</text>
  <text class="tiny" x="900" y="708">Diagnostics: scale routing per part, assignment map</text>

  <text class="tiny" x="80" y="812">解释：运动路由和形变路由共享人体部位语义；动态部位可使用短期运动，稳定部位保留长期上下文。</text>
  <text class="tiny" x="80" y="838">Interpretation: motion routing and deformation routing share body-part semantics; dynamic parts use short-scale motion while stable parts keep long-scale context.</text>
</svg>
